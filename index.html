<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eid Mubarak</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(to bottom,#00111f,#003566);
    overflow:hidden;
    font-family:Arial, sans-serif;
}

/* Stars */
.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:blink 2s infinite;
}

@keyframes blink{
    50%{opacity:0.2;}
}

/* Moon */
.moon{
    position:absolute;
    top:60px;
    right:120px;
    width:120px;
    height:120px;
    background:#fff7c2;
    border-radius:50%;
    box-shadow:0 0 30px #fff7c2;
}

/* Card */
.card{
    text-align:center;
    color:white;
    background:rgba(255,255,255,0.08);
    padding:40px;
    border-radius:20px;
    backdrop-filter:blur(8px);
    box-shadow:0 0 25px rgba(255,255,255,0.2);
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    50%{
        transform:translateY(-10px);
    }
}

h1{
    font-size:55px;
    color:gold;
    margin-bottom:15px;
}

p{
    font-size:22px;
    margin-bottom:20px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:gold;
    color:black;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
}
</style>
</head>
<body>

<div class="moon"></div>

<div class="star" style="top:10%;left:20%;"></div>
<div class="star" style="top:25%;left:60%;"></div>
<div class="star" style="top:15%;left:80%;"></div>
<div class="star" style="top:35%;left:30%;"></div>
<div class="star" style="top:50%;left:70%;"></div>
<div class="star" style="top:70%;left:15%;"></div>
<div class="star" style="top:80%;left:85%;"></div>

<div class="card">
    <h1>🌙 Eid Mubarak 🌙</h1>

    <p>
        May Allah fill your life with happiness,
        peace and countless blessings.
    </p>

    <button onclick="alert('✨ Eid Mubarak ✨')">
        Send Wishes
    </button>
</div>

</body>
</html>
